name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      # WarOrgan.Data comes with the repository as a git submodule, pinned to the commit the release is built against.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Note the WarOrgan.Data commit
        shell: bash
        run: echo "WARORGAN_DATA_COMMIT=$(git rev-parse HEAD:external/WarOrgan.Data)" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test bsdata-to-warorgan.slnx
      - name: Publish
        run: >
          dotnet publish tools/Converter -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true
          -p:WarOrganDataCommit=${{ env.WARORGAN_DATA_COMMIT }} -o publish
      - name: Archive
        shell: bash
        run: |
          name="warorgan-converter-${GITHUB_REF_NAME}-${{ matrix.rid }}"
          mkdir "$name" && cp -r publish/. "$name/"
          if [ "${{ matrix.rid }}" = "win-x64" ]; then 7z a "$name.zip" "$name"; else tar -czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: |
            warorgan-converter-*.zip
            warorgan-converter-*.tar.gz

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Note the WarOrgan.Data commit
        run: echo "WARORGAN_DATA_COMMIT=$(git rev-parse HEAD:external/WarOrgan.Data)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          $( [[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease )
          --notes "Built against WarOrgan.Data commit ${WARORGAN_DATA_COMMIT} (MIT, see THIRD-PARTY-NOTICES.md in the package). The package contains no game data: run it against your own copy of a BSData repository. See the README for how."
