name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # WarOrgan.Data comes with the repository as a git submodule, pinned to the commit the tool is built and tested against.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Unit tests use synthetic fixtures only; the integration tests skip themselves without BSDATA_SRC.
      - run: dotnet test bsdata-to-warorgan.slnx
