name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # The WarOrgan.Data commit the tool is built and tested against.
  WARORGAN_DATA_COMMIT: 45f934b8efcf4c988cd2cfd124458d78f09920c7

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zenchovey/WarOrgan.Data
          ref: ${{ env.WARORGAN_DATA_COMMIT }}
          path: WarOrgan.Data
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Unit tests use synthetic fixtures only; the integration tests skip themselves without BSDATA_SRC.
      - run: dotnet test tests/Converter.Tests -p:WarOrganDataPath=${{ github.workspace }}/WarOrgan.Data
